[package]
name = "botox-optimizer"
version = "2.3.1"
edition = "2021"
# Versión con la que se compila y testea (CI usa exactamente 1.99.1, variante GNU). Ver README > Compilar.
rust-version = "1.99"
description = "Optimizador de FPS y latencia para PC gamer con Windows"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui-phosphor = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
rfd = "0.15"
wmi = "0.18"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winreg = "0.55"

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
